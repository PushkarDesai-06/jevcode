name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Users run the committed bundles in plugins/*/dist, so they must match the source.
      - name: Committed bundles are up to date
        run: git diff --exit-code -- dist plugins || (echo "Run 'npm run build' and commit the result." && exit 1)
